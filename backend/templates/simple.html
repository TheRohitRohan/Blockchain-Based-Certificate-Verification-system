<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate</title>
</head>
<body>
    <h1 style="text-align:center;">Certificate of Achievement</h1>
    <h2 style="text-align:center;">{{UNIVERSITY_NAME}}</h2>
    <p style="text-align:center;">This is to certify that</p>
    <h3 style="text-align:center;">{{STUDENT_NAME}}</h3>
    <p style="text-align:center;">has successfully completed the course</p>
    <h4 style="text-align:center;">{{COURSE_NAME}}</h4>
    <p style="text-align:center;">{{DEGREE_TYPE}}</p>
    <p style="text-align:center;">Certificate ID: {{CERTIFICATE_ID}}</p>
    <p style="text-align:center;">Issue Date: {{ISSUE_DATE}}</p>
</body>
</html>
