<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate of Completion</title>
    <style>
        * { margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #1a1a2e;
            background: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* Full page height — 210mm for A4-L. The outer table stretches
           the content area so bottom bars always sit at the page edge. */
        .page {
            width: 100%;
            height: 210mm;
        }

        /* Outer layout table fills the full page height */
        .layout-table {
            width: 100%;
            height: 210mm;
            border-collapse: collapse;
        }

        .layout-top {
            height: 7mm;
            padding: 0;
        }

        /* Content row expands to fill remaining height */
        .layout-content {
            padding: 0;
            vertical-align: top;
        }

        .layout-bottom {
            height: 7mm;
            padding: 0;
        }

        /* No side borders — they caused width calculation issues with mPDF */
        .inner {
            padding: 5mm 10mm 4mm 10mm;
        }

        .header-table {
            width: 100%;
            border-collapse: collapse;
        }

        .header-table td {
            padding: 0 0 3mm 0;
            vertical-align: middle;
            border-bottom: 0.5pt solid #dbeafe;
        }

        /* Logo cell: fixed narrow width, image strictly constrained */
        .col-logo {
            width: 22mm;
            text-align: left;
        }

        /* Explicit px dimensions override any intrinsic image size in mPDF */
        .col-logo img {
            width: 20mm;
            height: 20mm;
            max-width: 20mm;
            max-height: 20mm;
        }

        .col-title {
            text-align: center;
            padding: 0 4mm 3mm 4mm;
        }

        .col-qr {
            width: 28mm;
            text-align: right;
        }

        .university-name {
            font-size: 9pt;
            color: #1e3a8a;
            font-weight: bold;
            letter-spacing: 1.5pt;
            text-transform: uppercase;
            margin-bottom: 1.5mm;
        }

        .cert-title {
            font-size: 20pt;
            color: #1e3a8a;
            font-weight: bold;
            letter-spacing: 3pt;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .qr-box {
            width: 26mm;
            height: 26mm;
            border: 1.5pt solid #1e3a8a;
            padding: 0.5mm;
            background: #ffffff;
        }

        .qr-box img {
            width: 25mm;
            height: 25mm;
            display: block;
        }

        .qr-label {
            font-size: 6pt;
            color: #6b7280;
            text-align: right;
            margin-top: 1mm;
            font-style: italic;
        }

        .body-section {
            text-align: center;
            padding: 4mm 0 3mm 0;
        }

        .presented-to {
            font-size: 9pt;
            color: #6b7280;
            font-style: italic;
            letter-spacing: 1pt;
            margin-bottom: 2mm;
        }

        .name-rule-top {
            border-top: 2pt solid #b8860b;
            margin-bottom: 1.5mm;
        }

        .student-name {
            font-size: 26pt;
            color: #1a1a2e;
            font-weight: bold;
            line-height: 1.15;
            padding: 0 20mm;
        }

        .name-rule-bottom {
            border-bottom: 2pt solid #b8860b;
            margin-top: 1.5mm;
            margin-bottom: 3mm;
        }

        .completion-text {
            font-size: 9pt;
            color: #4b5563;
            font-style: italic;
            margin-bottom: 1.5mm;
        }

        .course-name {
            font-size: 14pt;
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 1mm;
            line-height: 1.2;
        }

        .degree-type {
            font-size: 10pt;
            color: #7c3aed;
            font-style: italic;
        }

        /* Footer: just the date + cert ID centred, no signature columns */
        .footer-section {
            text-align: center;
            border-top: 0.5pt solid #dbeafe;
            padding-top: 3mm;
            margin-top: 3mm;
        }

        .issue-date {
            font-size: 8.5pt;
            color: #374151;
            font-family: Arial, sans-serif;
        }

        .issue-date strong {
            color: #1e3a8a;
        }

        .cert-note {
            font-size: 7pt;
            color: #6b7280;
            margin-top: 1.5mm;
            font-family: Arial, sans-serif;
        }

        .cert-note strong {
            color: #374151;
        }
    </style>
</head>
<body>
<div class="page">
<table class="layout-table">
    <tr>
        <td class="layout-top" style="background:#b8860b;">&nbsp;</td>
    </tr>
    <tr>
        <td style="height:2mm;background:#1e3a8a;padding:0;">&nbsp;</td>
    </tr>
    <tr>
        <td class="layout-content">
            <div class="inner">

                <table class="header-table">
                    <tr>
                        <td class="col-logo">
                            <img src="storage/assets/university-logo.png" width="76" height="76" alt="">
                        </td>
                        <td class="col-title">
                            <div class="university-name">{{UNIVERSITY_NAME}}</div>
                            <div class="cert-title">Certificate of Completion</div>
                        </td>
                        <td class="col-qr">
                            <div class="qr-box">{{QR_CODE}}</div>
                            <div class="qr-label">Scan to verify</div>
                        </td>
                    </tr>
                </table>

                <div class="body-section">
                    <div class="presented-to">This is to certify that</div>
                    <div class="name-rule-top"></div>
                    <div class="student-name">{{STUDENT_NAME}}</div>
                    <div class="name-rule-bottom"></div>
                    <div class="completion-text">has successfully completed the course</div>
                    <div class="course-name">{{COURSE_NAME}}</div>
                    <div class="degree-type">{{DEGREE_TYPE}}</div>
                </div>

                <div class="footer-section">
                    <div class="issue-date"><strong>Date of Issue:</strong> {{ISSUE_DATE}}</div>
                    <div class="cert-note"><strong>Certificate ID:</strong> {{CERTIFICATE_ID}}</div>
                </div>

            </div>
        </td>
    </tr>
    <tr>
        <td style="height:2mm;background:#1e3a8a;padding:0;">&nbsp;</td>
    </tr>
    <tr>
        <td class="layout-bottom" style="background:#b8860b;">&nbsp;</td>
    </tr>
</table>
</div>
</body>
</html>
