openapi: 3.0.0
info:
  title: Certificate Verification System API
  description: A decentralized certificate verification system using Ethereum blockchain for immutable, tamper-proof certificate records.
  version: 1.0.0
  contact:
    name: Certificate System Support
    email: support@certificate-system.com
  license:
    name: MIT

servers:
  - url: https://blockchain-based-certificate-verification-system-production.up.railway.app/api
    description: Railway Production Server
  - url: http://localhost:8000/api
    description: Local Development Server (PHP Built-in Server)
  - url: http://localhost/api
    description: Local Development Server (XAMPP/Root)
  - url: http://blockchain-based-certificate-verification-system-production.up.railway.app:8080/api
    description: Railway Production Server (Port 8080 fallback)
    
tags:
  - name: Authentication
    description: User authentication and registration
  - name: Certificates
    description: Certificate management operations
  - name: Public Verification
    description: Public certificate verification (no auth required)
  - name: Universities
    description: University management
  - name: Students
    description: Student management

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT Bearer token for authentication

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john.doe
        email:
          type: string
          format: email
          example: john@example.com
        role:
          type: string
          enum: [admin, university, student]
          example: student
        full_name:
          type: string
          example: John Doe
        avatar_path:
          type: string
          nullable: true
          example: storage/avatars/1.jpg
        university_id:
          type: integer
          example: 1

    University:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: MIT
        code:
          type: string
          example: MIT-001
        address:
          type: string
          example: Cambridge, MA
        contact_email:
          type: string
          format: email
          example: admin@mit.edu
        contact_phone:
          type: string
          example: "+1-617-253-1000"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Student:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        student_id:
          type: string
          example: STU-2024-001
        university_id:
          type: integer
          example: 1
        full_name:
          type: string
          example: Jane Smith
        email:
          type: string
          format: email
          example: jane@example.com
        date_of_birth:
          type: string
          format: date
          example: "2000-01-15"
        enrollment_date:
          type: string
          format: date
          example: "2022-08-01"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Certificate:
      type: object
      properties:
        id:
          type: integer
          example: 1
        certificate_id:
          type: string
          example: CERT-123ABC456
        student_id:
          type: integer
          example: 1
        university_id:
          type: integer
          example: 1
        course_name:
          type: string
          example: "Advanced Computer Science"
        degree_type:
          type: string
          example: "Bachelor of Science"
        issue_date:
          type: string
          format: date
          example: "2024-01-15"
        certificate_hash:
          type: string
          example: "0x1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p"
        pdf_hash:
          type: string
          example: "0xaf2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p"
        metadata_hash:
          type: string
          example: "0xaa2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p"
        onchain_hash:
          type: string
          example: "0xab2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p"
        blockchain_tx_hash:
          type: string
          example: "0x123abc456def789ghi012jkl345mno"
        status:
          type: string
          enum: [active, revoked, expired]
          example: active
        signature_status:
          type: boolean
          example: true
        is_revoked:
          type: boolean
          example: false
        student_name:
          type: string
          example: Jane Smith
        university_name:
          type: string
          example: MIT
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VerificationResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        valid:
          type: boolean
          example: true
        status:
          type: string
          example: "valid"
        blockchain_mode:
          type: string
          enum: [live, mock]
          description: "Indicates whether this certification was recorded on live Ethereum network or mocked without gas"
        message:
          type: string
          example: "Certificate is valid and verified on blockchain"
        certificate:
          $ref: '#/components/schemas/Certificate'
        checks:
          type: object
          properties:
            metadata_match:
              type: boolean
            pdf_hash_match:
              type: boolean
            blockchain_valid:
              type: boolean
            signature_valid:
              type: boolean
            not_revoked:
              type: boolean
        original_certificate:
          type: object
          properties:
            download_url:
              type: string
            certificate_id:
              type: string
        hash_mismatch_advisory:
          type: object
          nullable: true
          properties:
            title:
              type: string
            message:
              type: string
            action:
              type: string
        verified_fields:
          type: object

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "Invalid or missing authentication token"

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    PublicVerificationResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        matched:
          type: boolean
          description: Present on file upload method. True if all metadata and PDF hash match.
        conclusion:
          type: object
          properties:
            overall_status:
              type: string
              example: valid
            blockchain_mode:
              type: string
              enum: [live, mock]
              example: live
            is_valid:
              type: boolean
              example: true
            summary:
              type: string
            details:
              type: array
              items:
                type: string
        verification_result:
          type: object
          description: Present on ID-based verification
        checks:
          type: object
          description: Cryptographic and DB checks (present on PDF upload)
        certificate_id:
          type: string
          example: CERT-123ABC456
        certificate_info:
          type: object
          description: Authoritative certificate details for front-end rendering
          properties:
            identity:
              type: object
            status:
              type: object
            blockchain:
              type: object
            original_pdf:
              type: object
            visual_verification_note:
              type: string
        hash_mismatch_advisory:
          type: object
          nullable: true
          description: Populated if a PDF file does not perfectly match the binary hash recorded on blockchain
          properties:
            title:
              type: string
            message:
              type: string
            action:
              type: string
        verified_fields:
          type: object
          description: Confirmed correct fields straight from the DB
          
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return JWT token. If user has role='university', response includes additional university and admin details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@certificate-system.com
                password:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/User'
                  university:
                    type: object
                    nullable: true
                    description: "Present only if user role is 'university'"
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      address:
                        type: string
                  admin:
                    type: object
                    nullable: true
                    description: "Present only if user role is 'university'"
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        example: university
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - role
              properties:
                username:
                  type: string
                  example: john.doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
                full_name:
                  type: string
                  example: John Doe
                role:
                  type: string
                  enum: [admin, university, student]
                  example: student
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Returns the authenticated user's profile (no password_hash)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Authentication
      summary: Update user profile
      description: Update username and/or full_name. Email, password and role changes are not allowed here.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: new.username
                full_name:
                  type: string
                  example: New Full Name
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: No valid fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change the authenticated user's password. Requires current password verification.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  example: OldPassword123
                new_password:
                  type: string
                  format: password
                  example: NewPassword456
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error or wrong current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset email
      description: Send a password reset link to the given email. Always returns success to prevent user enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Reset email sent (or silently ignored if email not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Email field missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Complete password reset
      description: Reset password using the token received by email. Token expires after 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  example: a3f1b2c4d5e6...
                new_password:
                  type: string
                  format: password
                  example: NewSecurePass789
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid/expired token or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Logout endpoint. JWT is stateless; the frontend is responsible for deleting the token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/profile/avatar:
    put:
      tags:
        - Authentication
      summary: Upload user avatar
      description: Upload a profile avatar image (JPG/PNG, max 2MB). Replaces any existing avatar.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Avatar image file (JPG or PNG, max 2MB)
      responses:
        '200':
          description: Avatar updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error (wrong type, too large, no file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/university/register:
    post:
      tags:
        - Authentication
      summary: University portal registration
      description: Create a new university and register its admin account in one call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - university_name
                - university_email
                - university_phone
                - university_address
                - admin_name
                - admin_email
                - admin_password
              properties:
                university_name:
                  type: string
                  example: Massachusetts Institute of Technology
                university_code:
                  type: string
                  example: MIT
                university_email:
                  type: string
                  format: email
                  example: admin@mit.edu
                university_phone:
                  type: string
                  example: "+1-617-253-1000"
                university_address:
                  type: string
                  example: Cambridge, MA
                admin_name:
                  type: string
                  example: MIT Admin
                admin_email:
                  type: string
                  format: email
                  example: portal@mit.edu
                admin_password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        '200':
          description: University and admin created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  university_id:
                    type: integer
                    example: 3
                  message:
                    type: string
                    example: University registered successfully
        '400':
          description: Validation error or university already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-token:
    post:
      tags:
        - Authentication
      summary: Verify JWT token
      description: Verify and decode a JWT token without requiring authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user_id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    format: email
                  role:
                    type: string
                    enum: [admin, university, student]
                  university_id:
                    type: integer
                    nullable: true
                  admin_name:
                    type: string
                    nullable: true
                  university_name:
                    type: string
                    nullable: true
                  expires_at:
                    type: integer
                    description: Token expiration as Unix timestamp
        '400':
          description: Invalid or malformed token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /universities:
    get:
      tags:
        - Universities
      summary: Get all universities
      description: Retrieve list of all active universities
      responses:
        '200':
          description: List of universities retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  universities:
                    type: array
                    items:
                      $ref: '#/components/schemas/University'
    post:
      tags:
        - Universities
      summary: Create new university
      description: Create a new university (admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - code
              properties:
                name:
                  type: string
                  example: Massachusetts Institute of Technology
                code:
                  type: string
                  example: MIT-001
                address:
                  type: string
                  example: Cambridge, MA
                contact_email:
                  type: string
                  format: email
                contact_phone:
                  type: string
      responses:
        '200':
          description: University created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students:
    get:
      tags:
        - Students
      summary: Get students list
      description: Retrieve list of students (university/admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Students list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  students:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        student_id:
                          type: string
                        enrollment_date:
                          type: string
                          format: date
                        is_active:
                          type: boolean
                        full_name:
                          type: string
                        email:
                          type: string
                          format: email
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Students
      summary: Create new student
      description: Register a new student (university/admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - full_name
                - student_id
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                full_name:
                  type: string
                student_id:
                  type: string
                enrollment_date:
                  type: string
                  format: date
                university_id:
                  type: integer
                  description: Required for admin, auto-filled for university role
      responses:
        '200':
          description: Student created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /certificates/create:
    post:
      tags:
        - Certificates
      summary: Create a new certificate
      description: Generate and issue a new digital certificate (university/admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - student_id
                - course_name
                - issue_date
              properties:
                student_id:
                  type: integer
                  example: 1
                course_name:
                  type: string
                  example: Advanced Computer Science
                degree_type:
                  type: string
                  example: Bachelor of Science
                issue_date:
                  type: string
                  format: date
                  example: "2024-01-15"
      responses:
        '200':
          description: Certificate created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  certificate_id:
                    type: string
                  certificate_hash:
                    type: string
                  metadata_hash:
                    type: string
                  pdf_hash:
                    type: string
                  onchain_hash:
                    type: string
                  tx_hash:
                    type: string
                    nullable: true
                    description: "Null when blockchain_mode is mock"
                  blockchain_mode:
                    type: string
                    enum: [live, mock]
                  signature_status:
                    type: boolean
                  pdf_path:
                    type: string
                  qr_code:
                    type: string
                    nullable: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /certificates/upload:
    post:
      tags:
        - Certificates
      summary: Upload existing certificate PDF
      description: |
        Upload and register an existing physical/PDF certificate (university/admin only).
        All certificate metadata comes from the form fields — nothing is read from the PDF itself.
        The PDF is used purely as the visual document; any existing XMP metadata in it is overwritten.
        The certificate is hashed, signed, and anchored on the blockchain identically to /certificates/create.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - certificate
                - student_id
                - course_name
                - issue_date
              properties:
                certificate:
                  type: string
                  format: binary
                  description: The PDF file (max 10MB, validated by MIME type)
                student_id:
                  type: integer
                  description: Database row ID of the student (students.id). Must exist and belong to the issuing university.
                  example: 1
                university_id:
                  type: integer
                  description: Required for admin role only. Ignored for university role (taken from token automatically).
                  example: 2
                course_name:
                  type: string
                  description: Name of the course or program
                  example: Advanced Computer Science
                degree_type:
                  type: string
                  description: Type of degree (optional, free-text)
                  example: Bachelor of Science
                issue_date:
                  type: string
                  format: date
                  description: Date the certificate was issued (YYYY-MM-DD)
                  example: "2024-01-15"
      responses:
        '200':
          description: Certificate uploaded and processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  certificate_id:
                    type: string
                    example: CERT-ABC123XYZ
                  certificate_hash:
                    type: string
                  metadata_hash:
                    type: string
                  pdf_hash:
                    type: string
                  tx_hash:
                    type: string
                    nullable: true
                    description: "'pending' when blockchain_mode is mock"
                  blockchain_mode:
                    type: string
                    enum: [live, mock]
                  signature_status:
                    type: boolean
                  pdf_path:
                    type: string
                    example: CERT-ABC123XYZ_uploaded_2026-04-05.pdf
        '400':
          description: Validation or processing error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

